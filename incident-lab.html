<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Scenario Lab</title><meta name="description" content="Practice cybersecurity incident response with fictional scenarios and evidence."><style>
:root{--orange:#ef5827;--ink:#202725;--muted:#68716a;--line:#dde1d8;--paper:#f5f6ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.6 system-ui,sans-serif;color:var(--ink)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ee922e;outline-offset:4px}header{padding:21px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}.brand{font-weight:850;letter-spacing:-1px;font-size:21px}.mark{display:inline-block;width:22px;height:22px;background:var(--orange);transform:skew(-20deg);margin-right:12px;vertical-align:middle}.tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}main{max-width:1280px;margin:auto;padding:44px 5%}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#a44520}h1{font-size:clamp(36px,5vw,62px);letter-spacing:-2.7px;line-height:1.06;margin:16px 0 20px;max-width:800px}h2{font-size:25px;line-height:1.25;letter-spacing:-.6px}h3{font-size:16px}p{color:var(--muted)}.intro{display:flex;justify-content:space-between;gap:40px;align-items:end}.intro p{max-width:590px}.badge{border:1px solid var(--line);border-radius:30px;padding:7px 13px;font-size:12px;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:32px 0}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:25px;display:flex;flex-direction:column;min-height:290px}.card:first-child{border-top:4px solid var(--orange)}.number{font-size:12px;color:var(--muted);letter-spacing:2px}.card p{flex:1}.primary{background:var(--orange);border:0;color:white;border-radius:7px;padding:13px 20px;font-weight:750}.secondary{background:transparent;border:1px solid var(--line);padding:10px 16px;border-radius:7px;color:var(--ink)}.card button{text-align:left}.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}.workspace{display:grid;grid-template-columns:260px 1fr;gap:26px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px}.dark{background:#202b27;color:white}.dark p{color:#b4c2b8}.metric{margin:23px 0}.metric span{float:right}.bar{height:5px;background:#435047;border-radius:8px;margin-top:9px}.bar i{display:block;height:100%;background:#c6e27c;border-radius:8px}.steps{padding-left:20px;font-size:13px;color:#a9b9af}.steps li{margin:16px 0}.steps .active{color:#d2ed85;font-weight:800}.evidence{background:#f2f4ed;border:1px solid var(--line);border-radius:8px;padding:17px;margin:20px 0}.evidence pre{font:12px/1.9 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:15px 17px;border-radius:8px;margin:11px 0;transition:.15s}.choice:hover{border-color:var(--orange);background:#fff8f2}.choice b{display:inline-grid;place-items:center;background:#f0f2ec;width:28px;height:28px;margin-right:12px;border-radius:5px}.feedback{border-left:4px solid var(--orange);background:#fff5e9;padding:18px;margin:18px 0}.feedback p{margin:7px 0}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.result{font-size:72px;font-weight:850;letter-spacing:-4px}.pill{color:#6a7c3d;background:#edf3dc;border-radius:20px;padding:5px 12px;font-size:12px}.history{border-bottom:1px solid var(--line);padding:16px 0}.hidden{display:none}select{border:1px solid var(--line);padding:8px;border-radius:6px;background:white} @media(max-width:800px){.cards{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.intro{display:block}.workspace aside{display:none}header .tag{display:none}main{padding:28px 5%}.row{flex-wrap:wrap}h1{letter-spacing:-1.5px}}@media print{header,button,select,.foot{display:none}.workspace{display:block}.workspace aside{display:none}body{background:white}.panel{border:0}}</style>
<header><div class="brand"><span class="mark"></span>CYBER / SCENARIO LAB</div><div class="tag">Investigate. Decide. Defend.</div></header><main id="app"></main>
<script>
const scenarios=[{name:'The compromised account',category:'Identity · Remote access',desc:'An unexpected MFA approval. An unfamiliar session. Follow the evidence before an intruder moves deeper.',time:'8 min',steps:[
{title:'An approval that doesn’t add up',brief:'You are on duty at fictional Northstar Labs. An employee reports approving an MFA prompt they did not initiate. A successful remote session appeared shortly afterward.',log:'09:12:08  IDENTITY  user=alex.r  MFA=push_approved\n09:13:22  VPN       user=alex.r  src=198.51.100.24\n09:14:01  HELPDESK  Employee denies initiating sign-in',q:'What is your first response?',choices:[['Correlate identity and remote-access events; verify with the employee.',[30,15,25],'Correct direction. The employee report and session correlation support a suspected compromise. Preserve timestamps, session identifiers, and relevant logs while starting targeted containment.'],['Close the alert because MFA succeeded.',[0,0,20],'MFA success does not establish that the user intended the sign-in. The employee’s denial requires investigation.'],['Disable remote access for the entire company.',[10,20,0],'This can interrupt legitimate work unnecessarily. Identify and restrict the affected account and sessions first, unless wider evidence justifies broader action.']]},
{title:'Contain the identity',brief:'Correlation confirms the unfamiliar session belongs to the reported approval. The employee is using their normal workstation elsewhere. Treat the active remote session as suspicious.',log:'09:16:40  CORRELATION  New source + employee denial\n09:17:02  VPN          session=vpn-2041 ACTIVE\n09:17:31  ACCESS       Finance application requested',q:'Which action best contains the suspected identity compromise?',choices:[['Only reset the password and assume the active session ends.',[10,10,20],'Password resets may not invalidate every session or token. Explicitly revoke applicable sessions and tokens, restrict access, and verify termination.'],['Restrict the account, terminate the remote session, revoke applicable tokens, and secure recovery.',[25,35,20],'Strong containment. Use the relevant identity and access systems, verify that termination took effect, and re-establish trusted credentials and MFA enrollment.'],['Block only the observed source IP.',[10,10,20],'A source block can help, but the intruder can change addresses. It does not replace account and session containment.']]},
{title:'Look beyond the first session',brief:'The suspicious remote session is terminated. Review shows an internal server was accessed during the window. You must determine whether compromise extends beyond the account.',log:'09:18:10  TRAFFIC  alex.r → filesrv-02 tcp/445 ALLOW\n09:18:44  ENDPOINT filesrv-02 unusual process alert\n09:20:03  VPN      session=vpn-2041 TERMINATED',q:'What should you do next?',choices:[['Restore access immediately because the VPN session ended.',[0,0,20],'Ending one session does not resolve potential downstream compromise. Scope the server activity and preserve evidence before recovery.'],['Reboot the server and remove its logs.',[0,10,0],'This destroys useful evidence and can disrupt the investigation. Preserve evidence and apply proportionate containment through your incident process.'],['Investigate the server alert, preserve evidence, and isolate affected assets when justified.',[35,30,20],'Good scope expansion. Correlate network, identity, and endpoint evidence; contain confirmed affected assets and assess what data or systems were accessed.']]},
{title:'Recover with confidence',brief:'The server investigation is complete and affected assets have been contained. No further suspicious sessions are visible. The business wants to restore normal access.',log:'10:02:00  IDENTITY  Suspicious sessions revoked\n10:08:00  RESPONSE  Affected host contained and investigated\n10:15:00  MONITOR   No new matching activity observed',q:'What makes a sound recovery plan?',choices:[['Validate remediation, restore trusted access, monitor, and document lessons learned.',[30,20,35],'Recovery needs evidence: secure identity recovery, validated host remediation, staged access restoration, monitoring, and documented follow-up actions.'],['Restore everything and close the case without monitoring.',[5,5,15],'Lack of new alerts alone does not prove remediation. Validate recovery and monitor for recurrence.'],['Keep every employee locked out indefinitely.',[5,15,0],'Containment must be proportionate and reassessed. Restore verified systems and access in stages with appropriate monitoring.']]}]},
{name:'Ransomware on the move',category:'Endpoint · Network',desc:'A workstation starts modifying shared files. Balance fast containment with evidence preservation.',time:'6 min',steps:[
{title:'A burst of file changes',brief:'Fictional Northstar Labs reports rapidly renamed shared files and an endpoint ransomware alert.',log:'14:02 ENDPOINT ws-17 suspicious file encryption\n14:03 FILESHARE 1,200 file modifications / minute\n14:03 NETWORK ws-17 → filesrv-01 SMB',q:'What is your immediate priority?',choices:[['Isolate the affected workstation and restrict its share access; preserve evidence.',[35,40,25],'Targeted containment limits further damage while preserving investigative evidence. Coordinate with the incident team and protect backups.'],['Wait for every file to be analyzed.',[10,0,10],'Delaying containment while active damage continues can increase impact. Investigation and targeted containment should proceed together.'],['Delete all shared files.',[0,0,0],'This causes additional data loss. Contain affected access and protect recovery sources.']]},
{title:'Establish the scope',brief:'The workstation is isolated. A second host shows similar behavior. The team needs to understand the incident before restoring data.',log:'14:08 ENDPOINT ws-22 matching behavior\n14:09 BACKUP immutable recovery point available\n14:10 IDENTITY shared service-account use detected',q:'What comes next?',choices:[['Immediately restore files into the affected environment.',[5,0,15],'Restoring before containment and remediation risks renewed damage. Validate a clean recovery environment first.'],['Scope affected hosts and identities, contain them, and validate protected backups.',[35,35,30],'Correlate endpoint, network, and identity activity. Secure recovery sources and verify backup integrity before restoration.'],['Assume only the first workstation was affected.',[0,0,15],'The second host and shared identity are evidence of broader scope. Investigate both.']]},
{title:'Restore operations',brief:'The team has contained affected systems and identified the entry point. Verified recovery data is available.',log:'15:20 RESPONSE affected systems remediated\n15:25 BACKUP test restore successful\n15:30 CHANGE phased recovery approved',q:'Choose the recovery approach.',choices:[['Restore verified data in stages, monitor, and address the entry point.',[30,30,45],'A staged recovery with validation and monitoring reduces recurrence risk and helps prioritize critical business services.'],['Reconnect all systems without validation.',[0,0,20],'Unvalidated systems can reintroduce the threat. Confirm remediation before reconnecting.'],['Keep the business offline after remediation with no review.',[10,20,0],'Reassess containment and recover validated services according to business priorities.']]}]},
{name:'Data leaving the cloud',category:'Cloud · Data protection',desc:'A storage policy changes and download volume spikes. Determine exposure and stop further access.',time:'6 min',steps:[
{title:'An unexpected policy change',brief:'At fictional Northstar Labs, a cloud storage audit flags a newly public bucket containing internal documents.',log:'11:02 AUDIT storage-policy changed to public-read\n11:04 DATA inventory classification=internal\n11:06 ACCESS unfamiliar source downloads increased',q:'What should you do first?',choices:[['Remove unintended public access and preserve policy and access evidence.',[35,40,30],'Stop continued exposure while preserving audit evidence. Confirm required business access remains appropriately scoped.'],['Ignore it because the files are not labeled secret.',[0,0,20],'Internal data may still be sensitive. Validate classification, access scope, and actual exposure.'],['Delete the bucket and its audit trail.',[0,10,0],'Deleting evidence impairs scope assessment and may destroy business data. Restrict access and preserve evidence instead.']]},
{title:'Determine the exposure',brief:'The bucket is private again. The policy change used an automation identity. Access logs show downloads during the exposure window.',log:'11:02 AUDIT actor=automation-deploy\n11:04–11:12 ACCESS 842 object requests\n11:13 POLICY private access verified',q:'How do you assess impact?',choices:[['Treat every request as confirmed theft of a unique file.',[10,10,10],'Requests alone do not establish unique files or confirmed data loss. Correlate successful reads, objects, identities, and classification.'],['Review successful reads and data sensitivity; investigate and contain the automation identity.',[35,35,35],'Establish what was accessible and accessed, investigate the identity, and coordinate the impact assessment with appropriate stakeholders.'],['Close the incident because public access is removed.',[0,10,15],'Containment does not resolve the exposure assessment or the cause of the policy change.']]},
{title:'Prevent a repeat',brief:'The team identifies an overly permissive deployment workflow. The incident’s exposure has been assessed.',log:'12:10 REVIEW deployment permissions too broad\n12:20 RESPONSE affected credentials rotated\n12:30 VALIDATION business access restored',q:'Which follow-up is strongest?',choices:[['Apply least privilege, add policy checks and alerts, and validate remediation.',[30,30,35],'Combine identity controls, deployment guardrails, monitoring, and tested remediation. Track the changes to completion.'],['Rely on someone remembering to check weekly.',[10,5,15],'Manual review alone leaves a preventable gap. Add enforceable controls and detection.'],['Remove all cloud storage without assessing business needs.',[5,15,0],'Use proportionate controls and validated access requirements rather than broad disruption.']]}]}];
let current=0,round=0,answers=[],picked=null,mode='guided';const app=document.getElementById('app');let best={};try{best=JSON.parse(localStorage.getItem('cyberlab-best')||'{}')}catch{};
function home(){app.innerHTML=`<div class="intro"><div><div class="eyebrow">A hands-on defense experience</div><h1>Your next decision<br>changes the incident.</h1><p>Step into the analyst’s seat. Examine the evidence, make the call, and practice responding when the stakes are high.</p></div><span class="badge">● &nbsp; 3 playable missions · Fictional environments</span></div><div class="row"><span class="tag">Choose your mission / 01—03</span><label>Experience &nbsp;<select id="mode"><option value="guided">Guided — with analyst hints</option><option value="technical">Technical — evidence first</option></select></label></div><div class="cards">${scenarios.map((s,i)=>`<article class="card"><span class="number">MISSION 0${i+1} &nbsp; / &nbsp; ${s.time}</span><h2>${s.name}</h2><span class="eyebrow">${s.category}</span><p>${s.desc}</p><p style="font-size:12px">${best[i]!=null?'Personal best: '+best[i]+' / 100':'No attempts yet'}</p><button class="primary" onclick="start(${i})">Launch scenario <span style="float:right">↗</span></button></article>`).join('')}</div><div class="foot">Independent training prototype inspired by enterprise security workflows. Not an official Palo Alto Networks training product. All logs, companies, and incidents are simulated.</div>`;document.getElementById('mode').value=mode;document.getElementById('mode').onchange=e=>mode=e.target.value}
function start(i){current=i;round=0;answers=[];picked=null;render()}
function totals(){return answers.reduce((a,x)=>a.map((v,i)=>v+x.points[i]),[0,0,0])}function scores(){let max=[0,0,0];scenarios[current].steps.forEach(s=>max=max.map((v,i)=>v+Math.max(...s.choices.map(c=>c[1][i]))));return totals().map((v,i)=>Math.round(v/max[i]*100))}
function render(){let s=scenarios[current],step=s.steps[round],sc=scores();app.innerHTML=`<div class="row"><button class="secondary" onclick="home()">← Mission library</button><span class="tag">${mode==='guided'?'Guided':'Technical'} mode · Mission 0${current+1}</span></div><div class="workspace"><aside class="panel dark"><div class="eyebrow" style="color:#d2ed85">Incident command</div><h2>${s.name}</h2><p>Northstar Labs<br>Simulated environment</p>${['Investigation','Containment','Business continuity'].map((x,i)=>`<div class="metric">${x}<span>${sc[i]}%</span><div class="bar"><i style="width:${sc[i]}%"></i></div></div>`).join('')}<ol class="steps">${s.steps.map((x,i)=>`<li class="${i===round?'active':''}">${i<round?'✓ ':''}${x.title}</li>`).join('')}</ol></aside><section class="panel"><div class="row"><span class="eyebrow">Decision ${round+1} of ${s.steps.length}</span><span class="pill">${picked===null?'Awaiting your response':'Response recorded'}</span></div><h2>${step.title}</h2><p>${step.brief}</p><div class="evidence"><span class="tag">Evidence / simulated event stream</span><pre>${step.log}</pre></div>${mode==='guided'?'<p style="font-size:13px">Analyst hint: weigh the available evidence, targeted containment, and the impact on legitimate users.</p>':''}<h3>${step.q}</h3>${picked===null?step.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b>${c[0]}</button>`).join(''):`<div class="feedback"><strong>Your decision: ${step.choices[picked][0]}</strong><p>${step.choices[picked][2]}</p><p><b>Simulated consequence:</b> ${consequence(step.choices[picked][1])}</p></div><button class="primary" onclick="next()">${round===s.steps.length-1?'View mission debrief':'Continue investigation'} →</button>`}</section></div>`;window.scrollTo(0,0)}
function consequence(p){return p[0]+p[1]+p[2]>=65?'The response advances with useful evidence, focused containment, and controlled disruption.':p[2]===0?'Business disruption increases and the investigation needs corrective action.':'The incident remains incompletely scoped or contained; additional exposure may continue.'}
function choose(i){if(picked!==null)return;picked=i;answers.push({choice:i,points:scenarios[current].steps[round].choices[i][1]});render()}function next(){if(picked===null)return;if(++round>=scenarios[current].steps.length)return finish();picked=null;render()}
function finish(){let sc=scores(),overall=Math.round(sc.reduce((a,b)=>a+b,0)/3),s=scenarios[current];best[current]=Math.max(best[current]||0,overall);try{localStorage.setItem('cyberlab-best',JSON.stringify(best))}catch{}app.innerHTML=`<div class="row"><span class="eyebrow">Mission complete / Debrief</span><button class="secondary" onclick="home()">Mission library</button></div><h1>${overall>=80?'A considered response.':overall>=50?'Keep sharpening your response.':'Every decision is a learning opportunity.'}</h1><div class="panel"><div class="row"><div><span class="tag">${s.name}</span><div class="result">${overall}<small style="font-size:25px;letter-spacing:0;color:#68716a"> / 100</small></div></div><p>Training score based on evidence, containment,<br>and business continuity. No certification implied.</p></div><div class="cards" style="margin:16px 0">${['Investigation','Containment','Business continuity'].map((x,i)=>`<div class="evidence" style="margin:0"><span class="tag">${x}</span><h2>${sc[i]}%</h2></div>`).join('')}</div><h2>Your decision review</h2>${s.steps.map((st,i)=>`<div class="history"><strong>${i+1}. ${st.title}</strong><p>You chose: ${st.choices[answers[i].choice][0]}</p><p>${st.choices[answers[i].choice][2]}</p><small>Strongest response: ${st.choices[st.choices.map(c=>c[1].reduce((a,b)=>a+b,0)).indexOf(Math.max(...st.choices.map(c=>c[1].reduce((a,b)=>a+b,0))))][0]}</small></div>`).join('')}<h3>Connect the investigation</h3><p>In a Palo Alto Networks environment, discuss how NGFW traffic visibility, GlobalProtect remote-access records, and Cortex endpoint or analytics capabilities could contribute evidence and response actions. Actual visibility and controls depend on the deployed products, configuration, and integrations.</p><div class="row"><button class="primary" onclick="start(current)">Replay mission ↗</button><button class="secondary" onclick="window.print()">Print / save debrief as PDF</button></div></div>`;window.scrollTo(0,0)}home();
</script></html>
